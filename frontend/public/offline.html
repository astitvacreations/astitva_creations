<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Astitva Creations</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #111111;
      border: 1px solid #333333;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .logo {
      height: 70px;
      width: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }
    h1 {
      color: #d4af37;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    p {
      color: #a1a1a1;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 14px 28px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #d4af37;
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Astitva Creations" class="logo" />
    <h1>You Are Offline</h1>
    <p>Please check your internet connection and try again to continue exploring our luxury cinematic experiences.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
